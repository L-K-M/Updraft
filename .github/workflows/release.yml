name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    # GitHub no longer accepts macos-14 jobs ("configuration not supported").
    # macos-15 ships Xcode 16 or later; Package.swift still declares the
    # Swift 5.9 tools floor.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A tag is published only after the package's tests and release build pass.
      - run: swift test
      - run: swift build -c release
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
